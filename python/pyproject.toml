[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.11", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-scales-ops"
version = "0.2.0"
description = "Block-scaled FP8 / MXFP8 GEMM, MoE layer and attention kernels for sm_90, sm_100/sm_103 and sm_120/sm_121."
requires-python = ">=3.10"
dependencies = ["torch>=2.11"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
# sm_100 / sm_103 (B200 / B300) only. The MXFP8 router's CuTe-DSL rows -- the
# M <= 32 decode row of `_sm100_decode.py` and the mid-band/peak tier of
# `_sm100_dsl.py` -- import this package at runtime; every other architecture
# and every other path in this library works without it. The floor for the
# decode row is 4.5.0 (4.4.2 lacks `cute.nvgpu.OperandMajorMode` and
# `Numeric.bitcast`, both of which the vendored kernels use, and below the
# floor the decode row turns itself off rather than failing); 4.8.0 is pinned
# here because its JIT is two to three times faster than 4.4.2's on these
# configurations, while 4.5.0 through 4.5.2 are about four times slower.
sm100 = ["nvidia-cutlass-dsl>=4.8.0,<5"]

[tool.setuptools]
package-dir = { "" = "." }
# Package data comes from the explicit package-data table below only. With the default (true) setuptools also scans
# its file manifest, and warns once for every data directory with an importable name, which in _jit_include/ is
# hundreds of warnings; the files shipped are the same either way.
include-package-data = false
packages = [
    "fish_scales_ops",
    "fish_scales_ops.dense",
    "fish_scales_ops.compat",
    "fish_scales_ops.gemm",
    "fish_scales_ops.gemm._vendor",
    "fish_scales_ops.gemm._vendor.flashinfer_sm100_blockscaled",
    "fish_scales_ops.moe",
    "fish_scales_ops.attention",
    "fish_scales_ops.attention.backends",
]

[tool.setuptools.package-data]
# What a wheel carries next to the extension so that it runs without the source tree. scripts/build_wheel.sh stages
# all of it before the wheel is built; an in-place build has only _nvrtc/ (scripts/vendor_nvrtc.py), and a pattern
# that matches nothing adds nothing.
#   _nvrtc/        the bundled NVRTC 13.2.78 that compiles the sm_90 kernels
#   _jit_include/  every header those kernels compile with: deep_gemm/, CUTLASS include/ and the CUDA headers
#   _dsl/          the CUTLASS CuTe-DSL kernel of the sm_100/sm_103 mid-band tier
#   BUILD_INFO.json  how the wheel was built; fish_scales_ops.build_info() returns it
"fish_scales_ops" = ["_nvrtc/*", "_jit_include/**/*", "_dsl/*", "BUILD_INFO.json"]
# The vendored kernels are BSD-3-Clause; their notice travels with them.
"fish_scales_ops.gemm._vendor.flashinfer_sm100_blockscaled" = [
    "LICENSE", "README.md", "MANIFEST.md5",
]
